<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 2 — Композиція Мондріана</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px 16px;
    }

    h1 {
      margin: 0;
      text-align: center;
    }

    table {
      width: min(480px, calc(100vw - 32px));
      aspect-ratio: 6 / 5;
      table-layout: fixed;
      border-collapse: collapse;
      border: 6px solid #000;
    }

    td {
      border: 6px solid #000;
    }

    .white {
      background-color: #fff;
    }

    .yellow {
      background-color: #fffa69;
    }

    .blue {
      background-color: #074481;
    }

    .red {
      background-color: #ff5b2d;
    }
  </style>
</head>
<body>
  <main>
    <h1>Композиція з червоним, синім і жовтим</h1>
    <table aria-label="Композиція в стилі Піта Мондріана">
      <tbody>
        <tr>
          <td class="white" colspan="2"></td>
          <td class="white"></td>
          <td class="red" colspan="2" rowspan="2"></td>
          <td class="white"></td>
        </tr>
        <tr>
          <td class="yellow" rowspan="2"></td>
          <td class="white" colspan="2"></td>
          <td class="white"></td>
        </tr>
        <tr>
          <td class="white"></td>
          <td class="blue" colspan="2" rowspan="2"></td>
          <td class="white" colspan="2"></td>
        </tr>
        <tr>
          <td class="white"></td>
          <td class="white"></td>
          <td class="red"></td>
          <td class="yellow"></td>
        </tr>
        <tr>
          <td class="yellow"></td>
          <td class="white" colspan="2"></td>
          <td class="white"></td>
          <td class="blue"></td>
          <td class="white"></td>
        </tr>
      </tbody>
    </table>
    <a href="../index.html">Повернутись на головну</a>
  </main>
</body>
</html>
