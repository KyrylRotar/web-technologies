<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №6 — Завдання 3</title>
    <link rel="stylesheet" href="task3.css">
</head>
<body>
    <main class="page">
        <form class="form" method="post">
            <h1 class="form-title">Реєстрація на курс</h1>
            <p class="form-intro">Заповніть форму, щоб записатися на курс та розпочати навчання.</p>

            <div class="form-fields">
                <div class="form-group">
                    <label class="form-label form-label--required" for="firstname">Ім'я</label>
                    <input class="form-input" type="text" id="firstname" name="firstname"
                           autocomplete="given-name" required>
                </div>
                <div class="form-group">
                    <label class="form-label form-label--required" for="lastname">Прізвище</label>
                    <input class="form-input" type="text" id="lastname" name="lastname"
                           autocomplete="family-name" required>
                </div>
                <div class="form-group">
                    <label class="form-label form-label--required" for="email">Email</label>
                    <input class="form-input" type="email" id="email" name="email"
                           autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label class="form-label form-label--required" for="phone">Телефон</label>
                    <input class="form-input" type="tel" id="phone" name="phone"
                           autocomplete="tel" required>
                </div>
                <div class="form-group">
                    <label class="form-label form-label--required" for="password">Пароль</label>
                    <input class="form-input form-input--password" type="password" id="password"
                           name="password" autocomplete="new-password" minlength="8"
                           pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" required>
                </div>
                <div class="form-group">
                    <label class="form-label form-label--required" for="password-confirm">Повторіть пароль</label>
                    <input class="form-input form-input--password" type="password" id="password-confirm"
                           name="password-confirm" autocomplete="new-password" minlength="8" required>
                </div>
            </div>

            <div class="form-group form-group--full">
                <label class="form-label" for="about">Про себе</label>
                <textarea class="form-textarea" id="about" name="about"
                          placeholder="Розкажіть коротко про себе"></textarea>
            </div>

            <ul class="form-hints" aria-label="Вимоги до пароля">
                <li>Не менше 8 символів</li>
                <li>Хоча б одна цифра</li>
                <li>Хоча б одна велика літера</li>
                <li>Паролі мають збігатися</li>
            </ul>

            <p class="form-rules" id="course-rules">
                <input class="form-checkbox" type="checkbox" id="agree" name="agree" required>
                <label for="agree">Погоджуюсь з <a class="rules-link" href="#course-rules">правилами курсу</a></label>
            </p>

            <div class="form-buttons">
                <button class="btn btn-reset" type="reset">Скасувати</button>
                <button class="btn btn-submit" type="submit">Зареєструватись</button>
            </div>
        </form>
    </main>
</body>
</html>
