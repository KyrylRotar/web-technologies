<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Адаптивний layout — CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page__header">
      <h1>Завдання 5</h1>
      <p>Адаптивний layout сторінки з використанням CSS Grid і підходу mobile-first.</p>
    </header>

    <section class="example" aria-labelledby="columns-title">
      <h2 id="columns-title">1. Колонки та рядки</h2>
      <div class="layout layout--tracks">
        <header class="region region--header">header</header>
        <nav class="region region--navigation" aria-label="Навігація">navigation</nav>
        <aside class="region region--sidebar">sidebar</aside>
        <section class="region region--main">main</section>
        <aside class="region region--ads">ads</aside>
        <footer class="region region--footer">footer</footer>
      </div>
    </section>

    <section class="example" aria-labelledby="areas-title">
      <h2 id="areas-title">2. Іменовані області</h2>
      <div class="layout layout--areas">
        <header class="region region--header">header</header>
        <nav class="region region--navigation" aria-label="Навігація">navigation</nav>
        <aside class="region region--sidebar">sidebar</aside>
        <section class="region region--main">main</section>
        <aside class="region region--ads">ads</aside>
        <footer class="region region--footer">footer</footer>
      </div>
    </section>
  </main>
</body>
</html>
